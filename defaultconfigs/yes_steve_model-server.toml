#Yes Steve Model registers this file as a SERVER config, which NeoForge keeps
#per world: it is read from saves/<world>/serverconfig/ and a new world is
#seeded from this copy in defaultconfigs. A copy under config/ is never read -
#the one this pack shipped there did nothing at all, which is why the bandwidth
#number looked like it had not helped. Keys left out are filled in by the mod's
#own defaults, so a short file stays correct across updates.

#The default model ID when a player first enters the game.
#
#The mod's own "default" is a character of its own, drawn instead of the
#player: that is why a skin is visible while somebody is still loading and
#turns into a stranger the moment the model arrives. misc/2_steve is the mod's
#copy of vanilla Steve, and the mod special-cases it - for misc/2_steve and
#misc/1_alex it takes the texture from SkinManager.getInsecureSkin, which is
#the player's own skin, the one the launcher serves. So the animations stay and
#everybody keeps their face. Slim arms are misc/1_alex, chosen in the model
#screen. A player who already has a model keeps it; /ysm model set @a
#misc/2_steve - true moves everyone over at once.
DefaultModelId = "misc/2_steve"

[server_scheduler]
	#How fast the server may send models to a player, in Mbps.
	#
	#The mod ships 5, a throttle written for a public server with many players
	#joining at once. This build is played on one machine or over a LAN, and the
	#models are 61 MB: 622 files the mod unpacks out of its own jar on every
	#start, of which 56 MB is the wine_fox set. At 5 Mbps that is over a minute
	#and a half of "YSM Model Sync State: Loading" before the first model can
	#appear, every session, for a transfer that never leaves the machine.
	BandwidthLimit = 999
