#The Netherite Octoarachnopod runs on its own settings. This file names none of
#them on purpose: NeoForge fills every key a config is missing with the mod's
#own default when it reads it, so an empty file is the mod's defaults - today,
#and after any update that changes them.
#
#It is not deleted, because deleting it would only stop new instances from being
#tuned. The pack claims this path in launcher/pack-owned.txt, and shipping it
#empty is what puts an instance that already carries the old numbers - a visit
#every 60 to 120 minutes instead of the mod's 5 to 30, and a chase starting at
#32 blocks instead of 64 - back on the defaults.
