#The pack sets one number here and leaves the rest to the mod: NeoForge fills
#every key a config is missing with the mod's own default when it reads it, so
#a short file stays correct across updates instead of freezing today's defaults.

[server_scheduler]
	#How fast the server may send models to a player, in Mbps.
	#
	#Shipped as 5, which is a throttle written for a public server with many
	#players joining at once. This build is played on one machine or over a LAN,
	#and the models are 61 MB: 622 files that the mod unpacks out of its own jar
	#into config/yes_steve_model/builtin on every start, of which 56 MB is the
	#wine_fox set. At 5 Mbps that is over a minute and a half of "YSM Model Sync
	#State: Loading" before the first model can appear, every session, for a
	#transfer that never leaves the machine.
	BandwidthLimit = 999
