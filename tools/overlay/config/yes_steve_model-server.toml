#The pack sets two values here and leaves the rest to the mod: NeoForge fills
#every key a config is missing with the mod's own default when it reads it, so
#a short file stays correct across updates instead of freezing today's defaults.
#
#This is the file the mod reads. Yes Steve Model registers a SERVER config, and
#NeoForge keeps those in config/ - a copy under saves/<world>/serverconfig only
#overrides this one for that world, which is what the readme NeoForge writes in
#that folder says.

#The default model ID when a player first enters the game.
#
#misc/2_steve is the mod's own copy of vanilla Steve, and the mod special-cases
#it: for misc/2_steve and misc/1_alex, and for no other model, the texture comes
#from SkinManager.getInsecureSkin - the player's own skin, which here is the one
#the launcher serves. So a player who never chose anything is himself, with the
#mod's animations on top, and a player who presses F4 and picks a character is
#that character. Slim arms are misc/1_alex, one click away in the same screen.
#
#This was set to nothing for two days because the skin did not arrive, and the
#reason was the launcher's, not the mod's. Launcher release 222 started
#rewriting the textures on every read and stamping the clock into them;
#SkinManager keys its cache on exactly that text, so every read asked for a key
#nobody had ever seen, missed, and got the default face back. getInsecureSkin is
#the one caller that re-asks every time - the vanilla player keeps a single
#answer and polls it - which is why Steve went blank while the plain player did
#not. Launcher release 265 stamps the skin registry's own time instead, the key
#holds still, and the face is there. Seen in game before this was written back.
#
#A player carrying disabled = true from the days of /ysm model disable is drawn
#by the game and sees no model at all; /ysm model disable @a false gives them
#back to the mod.
DefaultModelId = "misc/2_steve"

[server_scheduler]
	#How fast the server may send models to a player, in Mbps.
	#
	#The mod ships 5, a throttle written for a public server with many players
	#joining at once. This build is played on one machine or over a LAN, and the
	#models are 61 MB: 622 files the mod unpacks out of its own jar on every
	#start, of which 56 MB is the wine_fox set. At 5 Mbps that is over a minute
	#and a half of "YSM Model Sync State: Loading" before the first model can
	#appear, every session, for a transfer that never leaves the machine.
	BandwidthLimit = 999
