#The pack sets two values here and leaves the rest to the mod: NeoForge fills
#every key a config is missing with the mod's own default when it reads it, so
#a short file stays correct across updates instead of freezing today's defaults.
#
#This is the file the mod reads. Yes Steve Model registers a SERVER config, and
#NeoForge keeps those in config/ - a copy under saves/<world>/serverconfig only
#overrides this one for that world, which is what the readme NeoForge writes in
#that folder says.

#The default model ID when a player first enters the game.
#
#Nobody is given a Yes Steve Model body unless they ask for one, and the reason
#is armour. A player who has a model is drawn by the mod instead of the game,
#and the mod draws only what its model has bones for. The built-in misc/2_steve
#and misc/1_alex have bones for the skin - Hat, Jacket, sleeves, pants, cape -
#and locators for a held item, an elytra and a backpack, and no armour at all:
#no helmet, no chestplate, no leggings, no boots. The mod knows whether they are
#worn - it offers has_helmet, has_leggings and has_boots to a model's animations
#- and leaves the drawing to the model. Curios are the same story: the only
#accessory it looks for is a Sophisticated Backpack, for the BackpackLocator.
#So a player in full netherite looked unarmoured, to himself and to everyone.
#
#Empty, the game draws the player, which shows the skin the launcher serves
#(since launcher release 265, which fixed the cache key that had been hiding
#it), the armour, the accessories and the elytra. Anyone who wants a character
#of their own presses F4 and picks one, animations and all, and gives up the
#armour on their own model knowingly. That is a choice worth offering and not
#one worth making for everybody.
DefaultModelId = ""

[server_scheduler]
	#How fast the server may send models to a player, in Mbps.
	#
	#The mod ships 5, a throttle written for a public server with many players
	#joining at once. This build is played on one machine or over a LAN, and the
	#models are 61 MB: 622 files the mod unpacks out of its own jar on every
	#start, of which 56 MB is the wine_fox set. At 5 Mbps that is over a minute
	#and a half of "YSM Model Sync State: Loading" before the first model can
	#appear, every session, for a transfer that never leaves the machine.
	BandwidthLimit = 999
