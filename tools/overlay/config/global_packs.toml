#This should under no circumstances be set to true in modpacks
#If set to true, the mod creates a new global folder, that is global for your user on your computer.
#The created folders will be:
# <user_home>/.minecraft_global_packs/required_datapacks
# <user_home>/.minecraft_global_packs/optional_datapacks
# <user_home>/.minecraft_global_packs/required_resourcepacks
# <user_home>/.minecraft_global_packs/optional_resourcepacks
enable_system_global_packs = false
config_version = 4
log_pack_ids = false

#This config allows you to add or remove folders or single files as Data-/Resourcepacks
#For that simply specify the file path to the folder/file relative to your .minecraft or instance folder
#With the current config you can place a Datapack into '.minecraft/global_packs/required_data' to force enable a datapack.
[resourcepacks]
	required = ["config/paxi/resourcepacks", "config/locked-resourcepacks"]
	#Packs that live inside a mod's jar cannot be put in a required folder, so they
	#are named here instead: Global Packs gives these the same (required, TOP,
	#fixedPosition) it gives a forced folder. Their order comes from
	#launcher/resourcepacks-default.txt, which the launcher writes every launch.
	enable_builtin = [
		"tropicraft_texture_update",
		"mod/boatiview",
		"mod/pastel:pastel_style_amethyst",
		"supplementaries:darker_ropes",
		"mod/pneumaticcraft:fusion_integration",
		"mod/cullleaves:resourcepacks/smartleaves",
		"mod/subtle_effects:resourcepacks/biome_color_water_particles",
		"mod/the_bumblezone:resourcepacks/shader_emissive",
		"builtin/overrides/deep_aether_additional_assets",
		"builtin/client/deep_aether_tooltips",
		"builtin/aether_tooltips",
		"mod/cobblemon:resourcepacks/regionbiasforms",
		"mod/cobblemon:resourcepacks/uniqueshinyforms",
		"mod/cobblemon:resourcepacks/gyaradosjump",
		"naturalist:custom_spawn_eggs",
		"mod/minecraft_cursor:resourcepacks/cursors_extended"
	]

[datapacks]
	required = ["config/paxi/datapacks"]
	optional = ["config/paxi/optional_data"]
	enable_builtin = []
