[[mixins]]
config = "ll8patches.mixins.json"

# Held apart on purpose, and not required: a pack without FapCraft loads this
# jar and quietly applies one mixin instead of two, rather than failing.
[[mixins]]
config = "ll8patches-fapcraft.mixins.json"

# EMI's JEI bridge and Just Dire Things: each optional, so a pack without
# the target mod loads this jar and applies the rest.
[[mixins]]
config = "ll8patches-emi.mixins.json"

[[mixins]]
config = "ll8patches-jdt.mixins.json"

[[mixins]]
config = "ll8patches-instrumentus.mixins.json"

[[mods]]
modId = "ll8patches"
version = "1.5.0"
displayName = "LL8 Patches"
authors = "LL8 Extended"
description = '''
Two small corrections this build makes to what it ships.

The inventory player preview is drawn at three quarters of the vanilla scale,
so this build's three-dimensional armour fits inside the panel it is clipped to
instead of being cut off at the top.

FapCraft hides every scene prop bone it has no branch for. Two of them carry
real textured geometry - the items on Ellie dressed and the egg the kobold
carries - and are shown again.

And a companion now wears its alternate model for the length of a scene. The
outfit is what picks the model file, the port never changed it, so a scene ran
with whatever the companion was standing in - and the default is the dressed
one. Whatever it wore before is put back however the scene ends.

Two details it hid that the original did not are shown again: Manglelie's
nipple bones, for which the original model class carries no rule at all, and
Galath's futa bones, which the original showed by default under a global
command switch rather than by appearance variant. Five other hidden groups
were checked against the original and left alone, because each turned out to
be hiding something for a reason.

EMI's bridge to JEI now implements the two IRecipeSlotBuilder methods JEI
19.51 made abstract, so plugins that place a slot by alignment stop failing
inside it and their recipes reach the viewer.

Just Dire Things no longer reads its server config from an item attribute
hook before that config exists; the abilities are skipped until it loads,
and the energy branch that does not need it still runs.

Instrumentus kiln recipes get an id built from the output's registry key
rather than its translated name, so a Russian client no longer loses all 35 of
them in EMI. EMI's bridge text widget now implements the aligned setPosition
JEI 19.51 made abstract, so those recipes keep their arrow and flame.

Mekanism chemicals on mekagenjei's JEI pages reach EMI as Mekanism's own EMI
stacks: EMI skips Mekanism's JEI plugin, which is where the chemical type is
registered, so a small JEI plugin here registers the type with no ingredients
and the bridge hands EMI the stack Mekanism already indexes. Nine pages of
gas burning, turbine steam, radioactive gases and fusion fuel come back.
'''

[[dependencies.ll8patches]]
modId = "neoforge"
type = "required"
versionRange = "[21.1,)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.ll8patches]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.1,1.22)"
ordering = "NONE"
side = "CLIENT"
