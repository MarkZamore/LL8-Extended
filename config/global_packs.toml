#This should under no circumstances be set to true in modpacks
#If set to true, the mod creates a new global folder, that is global for your user on your computer.
#The created folders will be:
# <user_home>/.minecraft_global_packs/required_datapacks
# <user_home>/.minecraft_global_packs/optional_datapacks
# <user_home>/.minecraft_global_packs/required_resourcepacks
# <user_home>/.minecraft_global_packs/optional_resourcepacks
enable_system_global_packs = false
config_version = 4
log_pack_ids = false

#This config allows you to add or remove folders or single files as Data-/Resourcepacks
#For that simply specify the file path to the folder/file relative to your .minecraft or instance folder
#With the current config you can place a Datapack into '.minecraft/global_packs/required_data' to force enable a datapack.
[resourcepacks]
	#Every resource pack this build locks, named the one way that works for all
	#of them: the mod compares this list against each pack's own id, whatever
	#the pack is and wherever it came from, and gives every match the same
	#(required, TOP, fixedPosition) - no tick to clear, no handle to drag.
	#
	#Nothing is left off this list any more. The villagers were the one choice
	#this build left open, and it closed: Gray's Mob Overhaul owns the villager
	#outright - model, textures and the properties file that deals out its
	#random skins - so any second villager pack lands its own model under
	#Gray's textures. Both that tried are gone. Order comes from
	#launcher/resourcepacks-default.txt, which the launcher writes every launch.
	#
	#required stays empty: a forced folder is the mod's other route to the same
	#end, and one route is enough.
	required = []
	optional = []
	enable_builtin = [
		"mod/iceandfire:resourcepacks/iaf_legacy",
		"builtin/2d_item_models",
		"sfm:classic",
