name: Publish LL8 pack

on:
  push:
    branches: [main]

concurrency:
  group: ll8-pack-latest
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # The pack tree (~3 GB) + its shallow .git + dist/assets copy (~3 GB)
      # barely fit the runner's ~14 GB root; drop preinstalled toolchains we
      # never use to make the job comfortable. Four deletes at once rather than
      # one after another: it is all unlinking, and the runner has the cores.
      - name: Free runner disk space
        run: |
          for path in /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL; do
            sudo rm -rf "$path" &
          done
          wait

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Fetch the files too large for git
        # Cobblemon is 123 MB, over GitHub's per-file limit, and the meme pack
        # would be committed twice: both are pulled here, by hash.
        run: python tools/fetch_remote_files.py

      # One step for the three checks that only read the tree. They take about a
      # second between them now and each one failing stops the job all the same,
      # so three steps bought nothing but three step setups.
      - name: Check the build
        run: |
          set -euo pipefail
          python tools/scan_mods.py --mods mods --fail-on-issues --lenient-ranges
          # A layout with a conflict, or one that forgot a mapping, does not ship.
          python tools/keybinds/check_preset.py
          # A ru_ru.snbt that does not parse, lacks keys of en_us, or broke a
          # colour code does not ship either; a stale overlay hash is caught here.
          python tools/quests-ru/ru.py check
          # Two lists decide the resource packs and both have gone quiet on
          # their own: a pack the order names and the lock does not is
          # draggable in game, and an edit that never reached the overlay
          # source is undone by the next update. Neither ships again.
          python tools/check_pack_locks.py

      - name: Generate manifest and stage assets
        run: python tools/generate_manifest.py --pack . --out dist --revision "$GITHUB_SHA"

      - name: Self-check staged assets
        run: python tools/generate_manifest.py --pack . --out dist --verify-only

      - name: Publish pack-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Recreate the rolling release from scratch. The launcher treats the
          # release as incomplete until pack-manifest.json is present, so it is
          # safe to delete and repopulate here.
          gh release delete pack-latest --yes --cleanup-tag || true
          git push origin :refs/tags/pack-latest || true
          sleep 5

          # Retried, because the create is the one step whose failure leaves the
          # pack with no release at all: the delete above has already happened,
          # and a launcher asking for pack-latest gets a 404 until somebody
          # notices. GitHub answered HTTP 500 here twice on 2026-08-29 and the
          # build was unreachable both times until the run was started again by
          # hand.
          created=""
          for attempt in 1 2 3 4 5; do
            if gh release create pack-latest \
              --target "$GITHUB_SHA" \
              --title "LL8 pack" \
              --notes "Rolling LL8 pack release. Revision: $GITHUB_SHA"; then
              created="yes"
              break
            fi
            # It may also have been created and then failed on the way back, in
            # which case there is nothing left to do.
            if gh release view pack-latest >/dev/null 2>&1; then
              created="yes"
              break
            fi
            echo "Release create failed (attempt $attempt/5)" >&2
            sleep $((attempt * 10))
          done
          if [ -z "$created" ]; then
            echo "pack-latest could not be created after 5 attempts" >&2
            exit 1
          fi

          upload_batch() {
            local attempt
            for attempt in 1 2 3; do
              if gh release upload pack-latest "$@" --clobber; then
                return 0
              fi
              echo "Upload batch failed (attempt $attempt/3)" >&2
              if [ "$attempt" -lt 3 ]; then
                sleep $((attempt * 15))
              fi
            done
            echo "Upload batch failed after 3 attempts" >&2
            return 1
          }

          batch=()
          for f in dist/assets/*; do
            batch+=("$f")
            if [ "${#batch[@]}" -eq 40 ]; then
              upload_batch "${batch[@]}"
              batch=()
            fi
          done
          if [ "${#batch[@]}" -gt 0 ]; then
            upload_batch "${batch[@]}"
          fi

          # The manifest is uploaded LAST: its presence marks the release as
          # complete and consumable for the launcher.
          upload_batch dist/pack-manifest.json
